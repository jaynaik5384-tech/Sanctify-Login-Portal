<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanctify Login Portal</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#123133);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Home Screen */

.home{
    text-align:center;
}

.home img{
    width:320px;
    margin-bottom:30px;
}

.signup-btn{
    padding:15px 50px;
    background:#007BFF;
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}

.signup-btn:hover{
    background:#0056b3;
}

/* Popup */

.popup{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
}

.container{
    width:420px;
    background:#fff;
    border-radius:20px;
    padding:35px;
    position:relative;
    animation:popup .3s;
}

@keyframes popup{

from{
transform:scale(.8);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.close{
    position:absolute;
    right:20px;
    top:15px;
    font-size:30px;
    cursor:pointer;
}

.logo{
    text-align:center;
}

.logo img{
    width:300px;
    margin-bottom:10px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

input{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.main-btn{
    width:100%;
    padding:15px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

.main-btn:hover{
    background:#0056b3;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.links a{
    color:#007BFF;
    text-decoration:none;
    cursor:pointer;
}

.links a:hover{
    text-decoration:underline;
}

.form{
    display:none;
}

.active{
    display:block;
}

.message{
    text-align:center;
    color:green;
    margin-top:15px;
}

</style>

</head>
<body>

<!-- Home -->

<div class="home">

<img src="Sanctify-Logo-PNG.png" alt="Logo">

<br>

<button class="signup-btn" onclick="openPopup()">
Sign Up
</button>

</div>

<!-- Popup -->

<div class="popup" id="popup">

<div class="container">

<span class="close" onclick="closePopup()">&times;</span>

<!-- Login -->

<div id="login" class="form active">

<div class="logo">
<img src="Sanctify-Logo-PNG.png">
</div>

<h2>Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button class="main-btn" onclick="login()">
Login
</button>

<div class="links">

<a onclick="showForm('forgot')">
Forgot Password?
</a>

<a onclick="showForm('signup')">
Create Account
</a>

</div>

<div id="loginMsg" class="message"></div>

</div>

<!-- Signup -->

<div id="signup" class="form">

<div class="logo">
<img src="Sanctify-Logo-PNG.png">
</div>

<h2>Create Account</h2>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<button class="main-btn" onclick="signup()">
Create Account
</button>

<div class="links">
<a onclick="showForm('login')">
Back to Login
</a>
</div>

<div id="signupMsg" class="message"></div>

</div>

<!-- Forgot -->

<div id="forgot" class="form">

<div class="logo">
<img src="Sanctify-Logo-PNG.png">
</div>

<h2>Forgot Password</h2>

<input type="email" placeholder="Enter Registered Email">

<button class="main-btn" onclick="resetPassword()">
Send Reset Link
</button>

<div class="links">

<a onclick="showForm('login')">
Back to Login
</a>

</div>

<div id="forgotMsg" class="message"></div>

</div>

</div>

</div>

<script>

function openPopup(){
document.getElementById("popup").style.display="flex";
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

window.onclick=function(e){

if(e.target==document.getElementById("popup")){

closePopup();

}

}

function showForm(form){

document.querySelectorAll(".form").forEach(function(f){

f.classList.remove("active");

});

document.getElementById(form).classList.add("active");

}

function login(){

document.getElementById("loginMsg").innerHTML="Login Successful (Demo)";

}

function signup(){

document.getElementById("signupMsg").innerHTML="Account Created Successfully (Demo)";

}

function resetPassword(){

document.getElementById("forgotMsg").innerHTML="Password Reset Link Sent (Demo)";

}

</script>


</body>
</html>
